<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Montserrat:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #030712;
    }
    .og {
      width: 1200px;
      height: 630px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 70% 55% at 50% 40%, rgba(37, 99, 235, 0.28) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(129, 140, 248, 0.12) 0%, transparent 60%),
        #030712;
      color: #F9FAFB;
      text-align: center;
      padding: 64px;
    }
    .brand {
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 800;
      font-size: 118px;
      line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 28px;
    }
    .tagline {
      font-family: Montserrat, system-ui, sans-serif;
      font-weight: 500;
      font-size: 28px;
      line-height: 1.4;
      color: #9CA3AF;
      max-width: 820px;
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="brand">Manageopy</div>
    <p class="tagline">Software a medida para PyMEs en Paraguay</p>
  </div>
</body>
</html>
